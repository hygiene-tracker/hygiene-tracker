spring.application.name=api

# Database: PostgreSQL 18.
# These defaults point at the local database from `docker compose up`. Every value can be
# overridden with an environment variable (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME),
# which is how the deployed API reaches Neon.
# The password is never committed: set SPRING_DATASOURCE_PASSWORD (see .env.example).
spring.datasource.url=jdbc:postgresql://localhost:5432/hygiene
spring.datasource.username=hygiene

# Flyway creates and changes the tables from src/main/resources/db/migration.
# Hibernate only checks that the entities match them and never changes the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
