spring.application.name=api

# Temporary H2 database configuration to be switched to Neon Postgres in production
spring.datasource.url=jdbc:h2:mem:hygienetracker
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
google.oauth.client-ids=${GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID:}}
github.oauth.client-id=${GITHUB_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET:}
github.oauth.callback-uri=${GITHUB_CALLBACK_URI:http://localhost:8080/api/auth/github/callback}
github.oauth.app-redirect-uri=${GITHUB_APP_REDIRECT_URI:hygiene-tracker://auth/github}
