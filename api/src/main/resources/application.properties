spring.application.name=api

# Render sets PORT; locally the API listens on 8080.
server.port=${PORT:8080}

# Web client origins allowed to call the API from a browser (comma-separated).
# Locally the Expo web dev server; on Render, the static site's URL.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}

# Database: PostgreSQL 18.
# These defaults point at the local database from `docker compose up`. Every value can be
# overridden with an environment variable (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME),
# which is how the deployed API reaches Neon.
# The password is never committed: set SPRING_DATASOURCE_PASSWORD (see .env.example).
spring.datasource.url=jdbc:postgresql://localhost:5432/hygiene
spring.datasource.username=hygiene

# Flyway creates and changes the tables from src/main/resources/db/migration.
# Hibernate only checks that the entities match them and never changes the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sign-in providers and the API's own JWT. Secrets come only from environment variables.
google.oauth.client-ids=${GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID:}}
github.oauth.client-id=${GITHUB_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET:}
jwt.secret=${JWT_SECRET}
