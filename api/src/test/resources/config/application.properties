# Test-only settings, layered on top of src/main/resources/application.properties
# (Spring Boot reads config/application.properties after the main file and lets it override).
#
# Every Spring test runs against a real, throwaway PostgreSQL 18 started by Testcontainers,
# so tests use the same database and Flyway migrations as production. Needs Docker.
spring.datasource.url=jdbc:tc:postgresql:18:///hygiene
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# Test-only signing key for the API's JWTs. Production reads JWT_SECRET from the environment.
jwt.secret=test-only-secret-at-least-32-characters-long
