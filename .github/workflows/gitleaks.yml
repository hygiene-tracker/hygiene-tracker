# Scans every commit in the repository for secrets (API keys, passwords, tokens) on every pull
# request and push to main. Runs the gitleaks CLI image directly, so no license key is needed.
# The "Secret scan" job is a required status check in the main branch protection rule.
name: Gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan every commit with gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --no-banner --verbose .
