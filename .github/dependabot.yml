# Weekly dependency update PRs for the app (npm) and the API (Gradle).
# Dependabot PRs follow the same rules as everyone's: an approval, green CI, and a merge by the
# sprint's captain or deputy.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app/hygiene-tracker-react"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # The Expo SDK pins these versions (`npx expo install --check`). They are upgraded together
    # with the SDK (`npx expo install --fix`), not one at a time by Dependabot.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"

  - package-ecosystem: "gradle"
    directory: "/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
